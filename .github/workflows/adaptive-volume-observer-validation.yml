name: Adaptive Volume Observer Validation

on:
  push:
    branches:
      - claude/adaptive-volume-observer
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore NiftySignal.sln
      - name: Test
        run: dotnet test NiftySignal.Tests/NiftySignal.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"
