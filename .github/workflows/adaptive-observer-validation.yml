name: Adaptive Observer Validation

on:
  push:
    branches:
      - feature/adaptive-market-observer-v1
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NiftySignal.Tests/NiftySignal.Tests.csproj

      - name: Build
        run: dotnet build NiftySignal.Tests/NiftySignal.Tests.csproj --configuration Release --no-restore

      - name: Test adaptive observer
        run: dotnet test NiftySignal.Tests/NiftySignal.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~AdaptiveObserver
