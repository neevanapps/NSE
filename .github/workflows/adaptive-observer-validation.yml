name: Adaptive Observer Validation

concurrency:
  group: adaptive-observer-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/adaptive-market-observer-v1
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Validate deployment syntax and source guards
        shell: pwsh
        run: |
          $tokens = $null; $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/deploy.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          try { & ./deploy.ps1 -Target Local -SkipTests -ExpectedCommitSha ('0' * 40); throw 'SHA guard did not reject.' }
          catch { if ($_.Exception.Message -notlike 'Expected source SHA*') { throw } }
          $probe = Join-Path $PWD 'adaptive-deploy-guard-probe.txt'
          try {
            Set-Content $probe 'isolated CI probe'
            try { & ./deploy.ps1 -Target Local -SkipTests; throw 'Dirty source guard did not reject.' }
            catch { if ($_.Exception.Message -notlike 'Deployment requires a clean source worktree*') { throw } }
          } finally { Remove-Item $probe -Force -ErrorAction SilentlyContinue }

      - name: Restore
        run: dotnet restore NiftySignal.slnx

      - name: Build
        id: build
        run: dotnet build NiftySignal.slnx --configuration Release --no-restore -p:SourceBranch=${{ github.ref_name }} -p:CommitSha=${{ github.sha }}

      - name: Test adaptive observer
        run: dotnet test NiftySignal.Tests/NiftySignal.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~AdaptiveObserver --logger "trx;LogFileName=adaptive.trx"

      - name: Generate initial adaptive DB migration for review
        if: ${{ hashFiles('NiftySignal.AdaptiveObserverData/Migrations/*.cs') == '' }}
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.11
          dotnet-ef migrations add InitialAdaptiveObserver \
            --project NiftySignal.AdaptiveObserverData/NiftySignal.AdaptiveObserverData.csproj \
            --output-dir Migrations

      - name: Generate frozen option universe migration for review
        if: ${{ hashFiles('NiftySignal.AdaptiveObserverData/Migrations/*FreezeSessionOptionUniverse.cs') == '' }}
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.11 || dotnet tool update --global dotnet-ef --version 10.0.11
          dotnet-ef migrations add FreezeSessionOptionUniverse \
            --project NiftySignal.AdaptiveObserverData/NiftySignal.AdaptiveObserverData.csproj \
            --output-dir Migrations

      - name: Apply migration to isolated PostgreSQL and check model drift
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.11 || dotnet tool update --global dotnet-ef --version 10.0.11
          dotnet-ef database update --project NiftySignal.AdaptiveObserverData/NiftySignal.AdaptiveObserverData.csproj
          dotnet-ef migrations has-pending-model-changes --project NiftySignal.AdaptiveObserverData/NiftySignal.AdaptiveObserverData.csproj

      - name: Upload generated adaptive migration
        if: ${{ hashFiles('NiftySignal.AdaptiveObserverData/Migrations/*.cs') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-observer-generated-migration
          path: NiftySignal.AdaptiveObserverData/Migrations
          if-no-files-found: ignore

      - name: Full solution regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test NiftySignal.Tests/NiftySignal.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=regression.trx"

      - name: Build dashboard browser gate
        run: dotnet build tools/AdaptiveDashboardValidation/AdaptiveDashboardValidation.csproj --configuration Release -p:BuildProjectReferences=false -p:SourceBranch=${{ github.ref_name }} -p:CommitSha=${{ github.sha }}

      - name: Install isolated Chromium
        run: pwsh tools/AdaptiveDashboardValidation/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Validate dashboard selectors and commit-to-visible latency
        run: dotnet tools/AdaptiveDashboardValidation/bin/Release/net10.0/AdaptiveDashboardValidation.dll "$GITHUB_WORKSPACE" "${{ github.sha }}"

      - name: Upload dashboard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-dashboard-validation
          path: artifacts/adaptive-dashboard-validation
          if-no-files-found: ignore

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-observer-test-evidence
          path: NiftySignal.Tests/TestResults
          if-no-files-found: ignore
